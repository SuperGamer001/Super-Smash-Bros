<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            cursor: url('./src/img/cursor/SmallSphere.png'), auto;
        }
        
        #canvas {
            width: 100%;
            height: 100vh;
            display: block;
        }

        #ui {
            position: absolute;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }
        #ui #damage-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 0.8vw;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0 1vw 1vh;
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        #ui #damage-container .damage-meter {
            display: inline-block;
            position: relative;
            /* background: white; */
            width: 10vw;
            height: 2vw;
            flex: 0 1 auto;
            bottom: 1.5vw;
            scale: 0.8;
        }
        #ui #damage-container .damage-meter .photo-container {
            width: 5vw;
            height: 5vw;
            margin-left: -2vw;
            margin-top: -1.5vw;
            position: absolute;
            transform: rotate(-20deg);
            /* overflow: hidden; */
        }
        #ui #damage-container .damage-meter .player-photo {
            width: 6.47vw;
            height: 7.6vw;
            margin-left: -0.53vw;
            margin-top: -1.8vw;
            transform: rotate(20deg);
            clip-path: polygon(0 0, 0 37%, 26.4% 99.3%, 99.2% 76.7%, 100% 0%);
            /* background: white; */
        }
        #ui #damage-container .damage-meter .damage-counter {
            position: absolute;
            width: 100%;
            height: 100%;
            margin-left: 2vw;
            margin-top: -0.53vw;
            display: flex;
            align-items: center;
            justify-content: right;
            font-size: 2.67vw;
            font-weight: 800;
            letter-spacing: -0.2vw;
            color: white;
            text-shadow: 0.27vw 0.27vw 0px black;
            -webkit-text-stroke: 0.067vw black;
        }
        .damage-decimal {
            font-size: 1.33vw;
            font-weight: 600;
            color: white;
            text-shadow: 1px 1px 0px black;
            -webkit-text-stroke: 0.5px black;
            margin-top: 1.4vw;
            letter-spacing: -0.067vw;
        }
        #ui #damage-container .damage-meter .fighter-name {
            position: absolute;
            width: 8.67vw;
            bottom: -1.47vw;
            left: 0.87vw;
            background: rgba(0, 0, 0, 0.4);
            font-size: 0.8vw;
            color: white;
            padding: 0.13vw 0.33vw;
            padding-left: 2.13vw;
            border-bottom: 0.2vw solid;
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="damage-container"></div>
    </div>
    <div id="canvas"></div>
    <script src="src/engines/three.min.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
