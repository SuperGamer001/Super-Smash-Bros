<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            cursor: url('./src/img/cursor/SmallSphere.png'), auto;
        }
        
        #canvas {
            width: 100%;
            height: 100vh;
            display: block;
        }

        #ui {
            position: absolute;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }
        #ui #damage-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: clamp(20px, 0.5vw, 10px);
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0 1vw 1vh;
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        #ui #damage-container .damage-meter {
            display: inline-block;
            position: relative;
            /* background: white; */
            width: clamp(80px, 10vw, 150px);
            height: clamp(16px, 2vw, 30px);
            flex: 0 1 auto;
        }
        #ui #damage-container .damage-meter .photo-container {
            width: clamp(40px, 5vw, 75px);
            height: clamp(40px, 5vw, 75px);
            margin-left: max(-30px, -2vw);
            margin-top: max(-22.5px, -1.5vw);
            position: absolute;
            transform: rotate(-20deg);
            /* overflow: hidden; */
        }
        #ui #damage-container .damage-meter .player-photo {
            width: clamp(52px, 6.47vw, 97px);
            height: clamp(61px, 7.6vw, 114px);
            margin-left: max(-8px, -0.53vw);
            margin-top: max(-27px, -1.8vw);
            transform: rotate(20deg);
            clip-path: polygon(0 0, 0 37%, 26.4% 99.3%, 99.2% 76.7%, 100% 0%);
            /* background: white; */
        }
        #ui #damage-container .damage-meter .damage-counter {
            position: absolute;
            width: 100%;
            height: 100%;
            margin-left: clamp(16px, 2vw, 30px);
            margin-top: max(-8px, -0.53vw);
            display: flex;
            align-items: center;
            justify-content: right;
            font-size: clamp(21px, 2.67vw, 40px);
            font-weight: 800;
            letter-spacing: max(-3px, -0.2vw);
            color: white;
            text-shadow: clamp(2px, 0.27vw, 4px) clamp(2px, 0.27vw, 4px) 0px black;
            -webkit-text-stroke: clamp(0.5px, 0.067vw, 1px) black;
        }
        .damage-decimal {
            font-size: clamp(11px, 1.33vw, 20px);
            font-weight: 600;
            color: white;
            text-shadow: 1px 1px 0px black;
            -webkit-text-stroke: 0.5px black;
            margin-top: clamp(11px, 1.4vw, 21px);
            letter-spacing: max(-1px, -0.067vw);
        }
        #ui #damage-container .damage-meter .fighter-name {
            position: absolute;
            width: clamp(70px, 8.67vw, 130px);
            bottom: max(-22px, -1.47vw);
            left: clamp(7px, 0.87vw, 13px);
            background: rgba(0, 0, 0, 0.4);
            font-size: clamp(7px, 0.8vw, 12px);
            color: white;
            padding: clamp(1px, 0.13vw, 2px) clamp(3px, 0.33vw, 5px);
            padding-left: clamp(17px, 2.13vw, 32px);
            border-bottom: clamp(1.5px, 0.2vw, 3px) solid;
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="damage-container"></div>
    </div>
    <div id="canvas"></div>
    <script src="src/engines/three.min.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
