<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            cursor: url('./src/img/cursor/SmallSphere.png'), auto;
        }
        
        #canvas {
            width: 100%;
            height: 100vh;
            display: block;
        }

        #ui {
            position: absolute;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }
        #ui #damage-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 2vw;
            position: absolute;
            bottom: 1vw;
            left: 0;
            right: 0;
            padding: 0 1vw 1vh;
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        #ui #damage-container .damage-meter {
            display: inline-block;
            position: relative;
            /* background: white; */
            width: 10vw;
            height: 2vw;
            flex: 0 1 auto;
            bottom: 1.5vw;
            scale: 0.8;
        }
        #ui #damage-container .damage-meter .photo-container {
            width: 5vw;
            height: 5vw;
            margin-left: -2vw;
            margin-top: -1.5vw;
            position: absolute;
            transform: rotate(-20deg);
            /* overflow: hidden; */
        }
        #ui #damage-container .damage-meter .player-photo {
            width: 6.47vw;
            height: 7.6vw;
            margin-left: -0.53vw;
            margin-top: -1.8vw;
            transform: rotate(20deg);
            clip-path: polygon(0 0, 0 37%, 26.4% 99.3%, 99.2% 76.7%, 100% 0%);
            /* background: white; */
        }
        #ui #damage-container .damage-meter .damage-counter {
            position: absolute;
            width: 100%;
            height: 100%;
            margin-left: 2vw;
            margin-top: -0.53vw;
            display: flex;
            align-items: center;
            justify-content: right;
            font-size: 2.67vw;
            font-weight: 800;
            color: white;
            text-shadow: 0.27vw 0.27vw 0px black;
            -webkit-text-stroke: 0.067vw black;
            z-index: 5;
        }
        .damage-decimal {
            font-size: 1.33vw;
            font-weight: 600;
            text-shadow: 0.1vw 0.1vw black;
            -webkit-text-stroke: 0.05vw black;
            margin-top: 1.4vw;
            letter-spacing: -0.067vw;
        }
        #ui #damage-container .damage-meter .fighter-name {
            position: absolute;
            width: 8.67vw;
            bottom: -1.47vw;
            left: 0.87vw;
            background: rgba(0, 0, 0, 0.4);
            font-size: 0.8vw;
            color: white;
            padding: 0.13vw 0.33vw;
            padding-left: 2.13vw;
            border-bottom: 0.2vw solid;
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
        }
        #ui #damage-container .damage-meter .series-logo {
            position: absolute;
            width: 6vw;
            height: 6vw;
            left: 7vw;
            top: -3.5vw;
            z-index: -2;
            background-color: #00aaff;
            mask-image: url(gray-image.png);
            mask-size: contain;
            mask-repeat: no-repeat;
            filter: brightness(0.5);
        }
        #ui #damage-container .stock-container {
            display: flex;
            align-items: flex-end;
            width: 10vw;
            height: 1.5vw;
            margin-left: 2vw;
            margin-top: 4vw;
        }
        #ui #damage-container .stock-container .stock {
            width: 2vw;
            height: 2vw;
            background-repeat: no-repeat;
            background-size: contain;
        }
        .stock-count {
            font-size: 1.5vw;
            font-weight: bold;
            color: white;
            text-shadow: 0.1vw 0.1vw black;
        }

        .damage-meter.high-damage {
            animation: soft-pulse 1s infinite;
        }
        .damage-meter.very-high-damage {
            animation: hard-pulse 0.5s infinite;
        }
        .damage-meter.KOd {
            animation: KOd-pulse 0.8s;
            filter: grayscale(100%) brightness(0.5);
        }

        /* Eliminated: permanent gray + scaled down */
        .damage-meter.eliminated {
            filter: grayscale(100%) brightness(0.5);
            transform: scale(0.8);
        }
        .damage-meter.eliminated .damage-counter {
            transform: scale(0.8);
            transform-origin: right center;
        }
        .damage-meter.eliminated .photo-container {
            filter: grayscale(100%);
        }
        .damage-meter.eliminated .player-photo {
            filter: grayscale(100%);
        }

        /* Damage counter shatter on KO */
        .damage-counter.shatter {
            animation: damageShatter 0.4s ease-out forwards;
            pointer-events: none;
        }
        /* individual shard fragments used by JS shatter (positioned inside .damage-meter) */
        .damage-shard {
            will-change: transform, opacity, left, top;
            image-rendering: pixelated;
        }
        @keyframes damageShatter {
            0%   { transform: scale(1); opacity: 1; filter: blur(0); }
            30%  { transform: scale(1.8) rotate(5deg); opacity: 0.8; filter: blur(0); }
            60%  { transform: scale(2.5) rotate(-3deg) translateY(-10px); opacity: 0.4; filter: blur(2px); }
            100% { transform: scale(3) rotate(8deg) translateY(-30px); opacity: 0; filter: blur(5px); }
        }
        /* Damage counter reappear on respawn */
        .damage-counter.reappear {
            animation: damageReappear 0.35s ease-out forwards;
        }
        @keyframes damageReappear {
            0%   { transform: scale(0); opacity: 0; }
            60%  { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes soft-pulse {
            0% { filter: drop-shadow(0 0 0.5vw red); }
            50% { filter: drop-shadow(0 0 1vw red); }
            100% { filter: drop-shadow(0 0 0.5vw red); }
        }
        @keyframes hard-pulse {
            0% { filter: drop-shadow(0 0 1vw red); }
            50% { filter: drop-shadow(0 0 2vw red); }
            100% { filter: drop-shadow(0 0 1vw red); }
        } 
        @keyframes KOd-pulse {
            0% { filter: grayscale(100%) brightness(0.5) drop-shadow(0 0 1vw red); }
            50% { filter: grayscale(100%) brightness(0.5) drop-shadow(0 0 2vw red); }
            100% { filter: grayscale(100%) brightness(0.5) drop-shadow(0 0 1vw red); }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="damage-container"></div>
    </div>
    <div id="canvas"></div>
    <script src="src/engines/three.min.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
